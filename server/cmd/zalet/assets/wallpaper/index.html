<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ZALET HOME — киоск</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #060608; font-family: "Segoe UI", sans-serif; color: #f2f0ed; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 40px; }
  #msg div { max-width: 640px; line-height: 1.5; }
  #msg b { display: block; font-size: 34px; margin-bottom: 14px; background: linear-gradient(135deg, #ff8a4c, #ff5a1f); -webkit-background-clip: text; color: transparent; }
  #msg span { color: #8c8c96; font-size: 18px; }
</style>
</head>
<body>
<div id="msg"><div><b>ZALET HOME</b><span id="t">Подключаюсь к панели…</span></div></div>
<script src="token.js"></script>
<script>
  // Wallpaper Engine не показывает вложенные страницы (iframe), поэтому обои сами переходят на панель дома.
  // Настройки (адрес, ключ, зона под значки, быстрые папки) приходят из свойств обоев и передаются панели в адресе.
  var q = new URLSearchParams(location.search);
  var DEF_FOLDERS = "Хранилище|\\\\192.168.1.1\\SSD;Фото|\\\\192.168.1.1\\SSD\\Photos";
  var cfg = { home: q.get("home") || "http://192.168.1.1", token: q.get("token") || "", nocams: q.has("nocams") ? q.get("nocams") === "1" : false,
              iconcols: 1, iconslots: 5, iconw: 75, iconh: 113, zonemode: "orange", quick: true, folders: DEF_FOLDERS };
  if (window.ZH_LOCAL_TOKEN && !cfg.token) cfg.token = window.ZH_LOCAL_TOKEN;
  if (window.ZH_LOCAL_HOME && !q.get("home")) cfg.home = window.ZH_LOCAL_HOME;
  if (window.ZH_LOCAL_FOLDERS) cfg.folders = window.ZH_LOCAL_FOLDERS;
  var go = null, got = false;
  function b64(s) { return btoa(unescape(encodeURIComponent(s))); }
  function launch() {
    if (!cfg.token) { document.getElementById("t").innerHTML = "Открой свойства обоев и вставь «Ключ доступа».<br>Он есть в панели: Роутер → Токен."; return; }
    var u = cfg.home.replace(/\/+$/, "") + "/?wp=1&token=" + encodeURIComponent(cfg.token) +
      "&nocams=" + (cfg.nocams ? "1" : "0") + "&ic=" + Math.round(cfg.iconcols) + "&is=" + Math.round(cfg.iconslots) +
      "&iw=" + Math.round(cfg.iconw) + "&ih=" + Math.round(cfg.iconh) + "&zmode=" + cfg.zonemode +
      "&quick=" + (cfg.quick ? "1" : "0") + "&folders=" + encodeURIComponent(b64(cfg.folders)) + "#kiosk";
    if (u !== go) { go = u; location.replace(u); }
  }
  window.wallpaperPropertyListener = {
    applyUserProperties: function (p) {
      got = true;
      // пустые свойства (или адрес по умолчанию) не затирают то, что записала утилита ZALET Setup в token.js
      var hv = p.homeurl ? String(p.homeurl.value || "").trim() : "";
      if (hv && !(window.ZH_LOCAL_HOME && hv === "http://192.168.1.1")) cfg.home = hv;
      var tv = p.token ? String(p.token.value || "").trim() : "";
      if (tv) cfg.token = tv;
      if (p.nocams) cfg.nocams = !!p.nocams.value;
      if (p.iconcols) cfg.iconcols = Number(p.iconcols.value) || 1;
      if (p.iconslots) cfg.iconslots = Number(p.iconslots.value) || 5;
      if (p.iconw) cfg.iconw = Number(p.iconw.value) || 75;
      if (p.iconh) cfg.iconh = Number(p.iconh.value) || 113;
      if (p.zonemode) cfg.zonemode = String(p.zonemode.value);
      if (p.quick) cfg.quick = !!p.quick.value;
      var fv = p.folders ? String(p.folders.value || "").trim() : "";
      if (fv) cfg.folders = fv;
      launch();
    }
  };
  setTimeout(function () { if (!got) launch(); }, 2500); // если свойства не пришли — пробуем с тем, что есть
</script>
</body>
</html>
