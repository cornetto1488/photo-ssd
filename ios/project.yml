name: PhotoSSD
options:
  bundleIdPrefix: ru.apodmarchuk
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  PhotoSSD:
    type: application
    platform: iOS
    sources:
      - path: PhotoSSD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.apodmarchuk.photossd
        PRODUCT_NAME: PhotoSSD
        INFOPLIST_FILE: PhotoSSD/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
