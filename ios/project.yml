name: PhotoSSD
options:
  bundleIdPrefix: ru.apodmarchuk
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.3"
    CURRENT_PROJECT_VERSION: "5"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  PhotoSSD:
    type: application
    platform: iOS
    sources:
      - path: PhotoSSD
      - path: Shared
    dependencies:
      - target: ZaletWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.apodmarchuk.photossd
        PRODUCT_NAME: PhotoSSD
        INFOPLIST_FILE: PhotoSSD/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Entitlements/PhotoSSD.entitlements

  ZaletWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.2"
    sources:
      - path: ZaletWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.apodmarchuk.photossd.widget
        PRODUCT_NAME: ZaletWidget
        INFOPLIST_FILE: ZaletWidget/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_ENTITLEMENTS: Entitlements/PhotoSSD.entitlements
        SKIP_INSTALL: "YES"
